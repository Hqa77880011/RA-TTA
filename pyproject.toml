[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ra-tta"
version = "0.1.0"
description = "RA-TTA: Reliability- and Ambiguity-Aware Adaptation for Vision-Language Tracking"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.2", "scikit-learn>=1.3", "matplotlib>=3.7", "pillow>=10"]

[project.scripts]
ra-tta = "ra_tta.cli:main"

[tool.setuptools.packages.find]
include = ["ra_tta*"]
